[project]
name = "rag-backend"
version = "1.0.0"
description = "Production-Grade RAG System Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "pymupdf>=1.24.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "faiss-cpu>=1.9.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.21",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
